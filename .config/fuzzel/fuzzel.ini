# ---
# Astral-Vagabond fuzzel
# Compact rounded-rect card. Palette: ~/.config/fuzzel/colors.ini
# (written by apply-theme-clients.sh from active-colors.json).
# ---

font=Fira Code:size=12,Noto Color Emoji:size=12
dpi-aware=auto
use-bold=yes
prompt="APPS "
placeholder=search
icon-theme=breeze-dark
icons-enabled=yes
fields=filename,name,generic,keywords,categories,comment
match-mode=fzf
sort-result=yes
match-counter=yes
terminal=ghostty -e
list-executables-in-path=no
show-actions=no
filter-desktop=no
minimal-lines=yes

anchor=center
lines=9
width=42
tabs=4
horizontal-pad=16
vertical-pad=12
inner-pad=10
line-height=28
letter-spacing=0
image-size-ratio=0.5

layer=overlay
namespace=launcher
exit-on-keyboard-focus-loss=yes

[colors]
# Ash fallback if colors.ini is missing
background=161616f8
text=a3a3a3ff
message=a3a3a3ff
prompt=c8c8c8ff
placeholder=454545ff
input=e5e5e5ff
match=c8c8c8ff
selection=333333ff
selection-text=e5e5e5ff
selection-match=c8c8c8ff
counter=6b6b6bff
border=c8c8c8ff

[border]
width=2
radius=8
selection-radius=4

[dmenu]
mode=text
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+g Control+c
execute=Return KP_Enter
execute-or-next=Tab
prev=Up Control+p
next=Down Control+n
clipboard-paste=Control+v XF86Paste

# Reopen main so `include` is not parsed as a key-binding.
[main]
include=~/.config/fuzzel/colors.ini
