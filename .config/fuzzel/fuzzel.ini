# ---
# Monoshell fuzzel — Ash monochrome
# Mirrors quickshell/monoshell Theme.qml
# bgPrimary #121212 | bgSurface #1A1A1A | bgElevated #242424
# accent #C8C8C8 | accentWarm #A3A3A3 | borderIdle #333333
# bgConsole #161616 @ ~0.95 opacity
# ---

font=Fira Code:size=12,Noto Color Emoji:size=12
dpi-aware=auto
use-bold=yes
prompt="APPS "
placeholder=search…
icon-theme=breeze-dark
icons-enabled=yes
fields=filename,name,generic,keywords,categories
match-mode=fzf
sort-result=yes
match-counter=no
terminal=ghostty -e
list-executables-in-path=no
show-actions=no
filter-desktop=no

anchor=center
lines=10
width=42
tabs=4
horizontal-pad=20
vertical-pad=12
inner-pad=10
line-height=28
letter-spacing=0
image-size-ratio=0.5

layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# bgConsole #161616 @ ~95%
background=161616f2
# textSecondary #A3A3A3
text=a3a3a3ff
message=a3a3a3ff
# accent #C8C8C8
prompt=c8c8c8ff
# textDim #454545
placeholder=454545ff
# textPrimary #E5E5E5
input=e5e5e5ff
# accent match
match=c8c8c8ff
# bgElevated selection
selection=242424ff
# textPrimary selected
selection-text=e5e5e5ff
selection-match=c8c8c8ff
# textMuted / borderIdle
counter=6b6b6bff
border=333333ff

[border]
width=2
radius=10
selection-radius=5

[dmenu]
mode=text
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+g Control+c
execute=Return KP_Enter
execute-or-next=Tab
prev=Up Control+p
next=Down Control+n
clipboard-paste=Control+v XF86Paste
