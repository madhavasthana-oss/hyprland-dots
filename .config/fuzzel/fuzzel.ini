# ---
# Astral-Vagabond fuzzel
# Frosted HUD card: generous padding, pill selection, large icons.
# Palette: ~/.config/fuzzel/colors.ini
# (written by apply-theme-clients.sh from active-colors.json).
# ---

font=Fira Code:size=14:weight=medium,JetBrainsMono Nerd Font:size=14,Noto Color Emoji:size=14
dpi-aware=auto
use-bold=yes
prompt="󰍉  "
placeholder=search
message=APPS
message-mode=wrap
icon-theme=breeze-dark
icons-enabled=yes
fields=filename,name,generic,keywords,categories,comment
match-mode=fzf
sort-result=yes
match-counter=yes
terminal=ghostty -e
list-executables-in-path=no
show-actions=no
filter-desktop=no
minimal-lines=yes
scaling-filter=lanczos3

anchor=center
lines=10
width=48
tabs=4
horizontal-pad=24
vertical-pad=18
inner-pad=16
line-height=36
letter-spacing=0.4
image-size-ratio=0.42

layer=overlay
namespace=launcher
exit-on-keyboard-focus-loss=yes

[colors]
# Ash glass fallback if colors.ini is missing
background=161616c4
text=a3a3a3ff
message=c8c8c8ff
prompt=c8c8c8ff
placeholder=a3a3a366
input=e5e5e5ff
match=c8c8c8ff
selection=c8c8c83a
selection-text=e5e5e5ff
selection-match=c8c8c8ff
counter=a3a3a388
border=c8c8c8dd

[border]
width=2
radius=16
selection-radius=12

[dmenu]
mode=text
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+g Control+c
execute=Return KP_Enter
execute-or-next=Tab
prev=Up Control+p
next=Down Control+n
clipboard-paste=Control+v XF86Paste

# Reopen main so `include` is not parsed as a key-binding.
[main]
include=~/.config/fuzzel/colors.ini
