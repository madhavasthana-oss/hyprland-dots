background_opacity          0.6
cursor_trail                1
window_padding_width        15
font_family Fira Code
font_size 12
# BEGIN_KITTY_THEME
# Dark Pastel
include current-theme.conf
# END_KITTY_THEME

# Tmux-style prefix keybinds (Ctrl+K) — mirrors Ghostty (Ctrl+G)
# Layouts needed for splits (h/v) and zoom (z → stack)
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical
include keybinds
