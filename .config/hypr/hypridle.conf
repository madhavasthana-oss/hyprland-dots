# Monoshell idle / lock pipeline
# Lock goes straight to hyprlock (the old quickshell:lock IPC was never wired
# and `pidof qs quickshell hyprlock` always succeeded while the bar ran, so
# hyprlock never launched from idle/loginctl).

$lock_cmd = pidof hyprlock >/dev/null || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15 min
    on-timeout = $suspend_cmd
}
