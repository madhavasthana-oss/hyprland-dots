# Astral-Vagabond idle / lock pipeline
# Quickshell WlSessionLock first; /usr/bin/hyprlock if the shell is down.

$lock_cmd = $HOME/.config/hypr/hyprland/scripts/lock-session.sh
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5 min
    on-timeout = $lock_cmd
}

listener {
    timeout = 600 # 10 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15 min
    on-timeout = $suspend_cmd
}
