# Ash monochrome lock palette — soft charcoal + silver
# Mirrors quickshell/monoshell Theme (Ash)

$accent        = rgba(200, 200, 200, 1.0)     # #C8C8C8
$accentWarm    = rgba(163, 163, 163, 1.0)     # #A3A3A3
$accentSoft    = rgba(115, 115, 115, 1.0)     # #737373
$textPrimary   = rgba(229, 229, 229, 1.0)     # #E5E5E5
$textSecondary = rgba(163, 163, 163, 1.0)     # #A3A3A3
$textMuted     = rgba(107, 107, 107, 1.0)     # #6B6B6B
$textDim       = rgba(69, 69, 69, 1.0)        # #454545
$bgPrimary     = rgba(18, 18, 18, 1.0)        # #121212
$bgSurface     = rgba(26, 26, 26, 0.78)       # frosted surface
$bgElevated    = rgba(36, 36, 36, 0.88)
$bgIsland      = rgba(22, 22, 22, 0.82)       # #161616 toolbar fill
$borderIdle    = rgba(51, 51, 51, 0.55)       # #333333
$borderActive  = rgba(200, 200, 200, 0.90)
$stateSafe     = rgba(138, 138, 138, 1.0)     # #8A8A8A
$stateCritical = rgba(232, 232, 232, 1.0)     # #E8E8E8

# Input
$entry_background_color = rgba(18, 18, 18, 0.55)
$entry_border_color     = rgba(200, 200, 200, 0.75)
$entry_border_check     = rgba(163, 163, 163, 1.0) rgba(200, 200, 200, 1.0) 90deg
$entry_border_fail      = rgba(107, 107, 107, 1.0) rgba(232, 232, 232, 1.0) 40deg
$entry_color            = rgba(229, 229, 229, 1.0)
$caps_color             = rgba(163, 163, 163, 1.0) rgba(107, 107, 107, 1.0) 120deg

# Legacy aliases used by older widgets
$text_color = $textSecondary

$font_family       = Fira Code
$font_family_clock = KogniGear
$font_display      = KogniGear
