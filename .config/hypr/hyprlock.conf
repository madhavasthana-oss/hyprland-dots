# Monoshell lock — end-4 spatial language, Ash monochrome palette
#
# Coordinate system (hyprlock):
#   halign/valign place the anchor; position is an offset from that anchor.
#   With center/center: +y = up, -y = down. Stick to pixels — no % offsets.
#
# Layout (1920×1080 baseline, scales fine on similar panels):
#        status ······                  ······ layout
#
#                        [ skull ]
#                     EYE CANDY CLOCK
#                          date
#
#         [ calendar ]   [ passphrase ]   [ power ]
#                           caps
#
#              user ······ DOOMSHELL ······ bat
#
# Cursor visible. Unlock with password + Enter.
# Power tiles are clickable (shape + label onclick).

source = ~/.config/hypr/hyprlock/colors.conf

$logo = /home/madhav/Doomslayer-mod/Pictures/logos/doom-skull.png

general {
    hide_cursor = false
    ignore_empty_input = false
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = doomOut, 0.05, 0.7, 0.1, 1.0
    bezier = doomIn, 0.3, 0.0, 0.8, 0.15
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, doomOut
    animation = fadeOut, 1, 4, doomIn
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 4, doomOut
    animation = inputFieldFade, 1, 3, doomOut
}

# ── Stage ──────────────────────────────────────────────────────────
background {
    monitor =
    path = screenshot
    color = $bgPrimary
    blur_passes = 3
    blur_size = 8
    brightness = 0.40
    contrast = 0.92
    vibrancy = 0.15
    vibrancy_darkness = 0.2
    noise = 0.012
}

# ── Corners (status TL, layout BR) ─────────────────────────────────
label {
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $textSecondary
    font_size = 14
    font_family = $font_family
    position = 28, -28
    halign = left
    valign = top
    zindex = 5
}

label {
    monitor =
    text = $LAYOUT
    color = $textMuted
    font_size = 13
    font_family = $font_family
    position = -28, 28
    halign = right
    valign = bottom
    zindex = 5
}

# ── Eye candy clock (top center) ───────────────────────────────────
image {
    monitor =
    path = $logo
    size = 52
    rounding = 0
    border_size = 0
    position = 0, 380
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(255, 69, 0, 0.40)
    shadow_boost = 1.3
}

# Hours
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $textPrimary
    font_size = 96
    font_family = $font_family_clock
    position = -92, 300
    halign = center
    valign = center
    zindex = 3
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.75)
    shadow_boost = 1.25
}

# Glowing separator
label {
    monitor =
    text = ·
    color = $accent
    font_size = 72
    font_family = $font_family_clock
    position = 0, 300
    halign = center
    valign = center
    zindex = 3
    shadow_passes = 3
    shadow_size = 16
    shadow_color = rgba(200, 200, 200, 0.35)
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $textPrimary
    font_size = 96
    font_family = $font_family_clock
    position = 92, 300
    halign = center
    valign = center
    zindex = 3
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.75)
    shadow_boost = 1.25
}

# Seconds pill
shape {
    monitor =
    size = 64, 28
    color = $bgIsland
    rounding = 14
    border_size = 1
    border_color = $borderIdle
    position = 0, 230
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = $textSecondary
    font_size = 16
    font_family = $font_family
    position = 0, 230
    halign = center
    valign = center
    zindex = 3
}

# Date line
label {
    monitor =
    text = cmd[update:30000] date +"%A  ·  %d %B %Y"
    color = $textSecondary
    font_size = 15
    font_family = $font_family
    position = 0, 190
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = << LOCKED · RIP AND TEAR >>
    color = $textMuted
    font_size = 12
    font_family = $font_display
    position = 0, 160
    halign = center
    valign = center
    zindex = 2
}

# ── Calendar (left of password) ────────────────────────────────────
shape {
    monitor =
    size = 280, 220
    color = $bgIsland
    rounding = 20
    border_size = 1
    border_color = $borderIdle
    position = -360, -10
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.1
}

label {
    monitor =
    text = CALENDAR
    color = $textDim
    font_size = 10
    font_family = $font_display
    position = -360, 80
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:60000] /home/madhav/.config/hypr/hyprlock/calendar.sh
    color = $textSecondary
    font_size = 13
    font_family = $font_family
    text_align = center
    position = -360, -18
    halign = center
    valign = center
    zindex = 3
}

# ── Auth cluster (center) ──────────────────────────────────────────
shape {
    monitor =
    size = 420, 72
    color = $bgIsland
    rounding = 36
    border_size = 1
    border_color = $borderIdle
    position = 0, -10
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 3
    shadow_size = 20
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.15
}

input-field {
    monitor =
    size = 380, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    font_family = $font_family
    fade_on_empty = false
    rounding = 26
    check_color = $entry_border_check
    fail_color = $entry_border_fail
    fail_text = <span foreground="##E8E8E8"><b>DENIED</b></span> <span foreground="##A3A3A3">$ATTEMPTS</span>
    placeholder_text = <span foreground="##6B6B6B">enter passphrase…</span>
    capslock_color = $caps_color
    position = 0, -10
    halign = center
    valign = center
    zindex = 4
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(255, 69, 0, 0.22)
}

# Caps warning — directly under the pill
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $accentWarm
    font_size = 13
    font_family = $font_family
    position = 0, -70
    halign = center
    valign = center
    zindex = 5
}

# ── Power actions (right of password) ──────────────────────────────
# Panel chrome
shape {
    monitor =
    size = 200, 260
    color = $bgIsland
    rounding = 20
    border_size = 1
    border_color = $borderIdle
    position = 360, -10
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.1
}

label {
    monitor =
    text = POWER
    color = $textDim
    font_size = 10
    font_family = $font_display
    position = 360, 100
    halign = center
    valign = center
    zindex = 3
}

# --- Suspend ---
shape {
    monitor =
    size = 168, 44
    color = $bgElevated
    rounding = 12
    border_size = 1
    border_color = $borderIdle
    position = 360, 55
    halign = center
    valign = center
    zindex = 3
    onclick = systemctl suspend
}

label {
    monitor =
    text = ☽  SUSPEND
    color = $textSecondary
    font_size = 13
    font_family = $font_family
    position = 360, 55
    halign = center
    valign = center
    zindex = 4
    onclick = systemctl suspend
}

# --- Logout ---
shape {
    monitor =
    size = 168, 44
    color = $bgElevated
    rounding = 12
    border_size = 1
    border_color = $borderIdle
    position = 360, 0
    halign = center
    valign = center
    zindex = 3
    onclick = hyprctl dispatch exit
}

label {
    monitor =
    text = ↩  LOG OUT
    color = $textSecondary
    font_size = 13
    font_family = $font_family
    position = 360, 0
    halign = center
    valign = center
    zindex = 4
    onclick = hyprctl dispatch exit
}

# --- Reboot ---
shape {
    monitor =
    size = 168, 44
    color = $bgElevated
    rounding = 12
    border_size = 1
    border_color = $borderIdle
    position = 360, -55
    halign = center
    valign = center
    zindex = 3
    onclick = systemctl reboot
}

label {
    monitor =
    text = ↻  REBOOT
    color = $textSecondary
    font_size = 13
    font_family = $font_family
    position = 360, -55
    halign = center
    valign = center
    zindex = 4
    onclick = systemctl reboot
}

# --- Shutdown ---
shape {
    monitor =
    size = 168, 44
    color = $bgElevated
    rounding = 12
    border_size = 1
    border_color = $borderActive
    position = 360, -110
    halign = center
    valign = center
    zindex = 3
    onclick = systemctl poweroff
}

label {
    monitor =
    text = ⏻  SHUTDOWN
    color = $textPrimary
    font_size = 13
    font_family = $font_family
    position = 360, -110
    halign = center
    valign = center
    zindex = 4
    onclick = systemctl poweroff
}

# ── Bottom strip (user / brand) ────────────────────────────────────
label {
    monitor =
    text = SLAYER // $USER
    color = $textSecondary
    font_size = 14
    font_family = $font_family
    position = 0, 56
    halign = center
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = DOOMSHELL
    color = $textDim
    font_size = 11
    font_family = $font_display
    position = 0, 28
    halign = center
    valign = bottom
    zindex = 2
}
