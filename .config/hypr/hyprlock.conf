# Monoshell lock — end-4 spatial language, Ash monochrome palette
#
# Coordinate system (hyprlock):
#   halign/valign place the anchor; position is an offset from that anchor.
#   With center/center: +y = up, -y = down. Stick to pixels — no % offsets.
#
# Layout (1920×1080 baseline, scales fine on similar panels):
#        status ······                  ······ layout
#
#                        [ skull ]
#                          TIME
#                          date
#                     << LOCKED >>
#
#                    [ passphrase pill ]
#                        caps hint
#
#              user ······ DOOMSHELL ······ bat
#
# Cursor visible. Unlock with password + Enter.

source = ~/.config/hypr/hyprlock/colors.conf

$logo = /home/madhav/Doomslayer-mod/Pictures/logos/doom-skull.png

general {
    hide_cursor = false
    ignore_empty_input = false
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = doomOut, 0.05, 0.7, 0.1, 1.0
    bezier = doomIn, 0.3, 0.0, 0.8, 0.15
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, doomOut
    animation = fadeOut, 1, 4, doomIn
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 4, doomOut
    animation = inputFieldFade, 1, 3, doomOut
}

# ── Stage ──────────────────────────────────────────────────────────
background {
    monitor =
    path = screenshot
    color = $bgPrimary
    blur_passes = 3
    blur_size = 8
    brightness = 0.40
    contrast = 0.92
    vibrancy = 0.15
    vibrancy_darkness = 0.2
    noise = 0.012
}

# ── Corners (end-4 hyprlock: status TL, layout BR) ─────────────────
label {
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $textSecondary
    font_size = 14
    font_family = $font_family
    position = 28, -28
    halign = left
    valign = top
    zindex = 5
}

label {
    monitor =
    text = $LAYOUT
    color = $textMuted
    font_size = 13
    font_family = $font_family
    position = -28, 28
    halign = right
    valign = bottom
    zindex = 5
}

# ── Upper cluster (all center/center, +y = up) ─────────────────────
image {
    monitor =
    path = $logo
    size = 64
    rounding = 0
    border_size = 0
    position = 0, 280
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(255, 69, 0, 0.40)
    shadow_boost = 1.3
}

label {
    monitor =
    text = $TIME
    color = $textPrimary
    font_size = 72
    font_family = $font_family_clock
    position = 0, 180
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.70)
}

label {
    monitor =
    text = cmd[update:30000] date +"%A, %B %d"
    color = $textSecondary
    font_size = 16
    font_family = $font_family
    position = 0, 120
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = << LOCKED · RIP AND TEAR >>
    color = $textMuted
    font_size = 12
    font_family = $font_display
    position = 0, 90
    halign = center
    valign = center
    zindex = 2
}

# ── Auth cluster (center of screen, slight drop) ───────────────────
# Soft island behind the field so it reads like end-4’s toolbar pill
shape {
    monitor =
    size = 420, 72
    color = $bgIsland
    rounding = 36
    border_size = 1
    border_color = $borderIdle
    position = 0, -10
    halign = center
    valign = center
    zindex = 2
    shadow_passes = 3
    shadow_size = 20
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.15
}

input-field {
    monitor =
    size = 380, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    font_family = $font_family
    fade_on_empty = false
    rounding = 26
    check_color = $entry_border_check
    fail_color = $entry_border_fail
    fail_text = <span foreground="##E8E8E8"><b>DENIED</b></span> <span foreground="##A3A3A3">$ATTEMPTS</span>
    placeholder_text = <span foreground="##6B6B6B">enter passphrase…</span>
    capslock_color = $caps_color
    position = 0, -10
    halign = center
    valign = center
    zindex = 4
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(255, 69, 0, 0.22)
}

# Caps warning — directly under the pill
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $accentWarm
    font_size = 13
    font_family = $font_family
    position = 0, -70
    halign = center
    valign = center
    zindex = 5
}

# ── Bottom strip (user / brand) — single baseline, no multi-island math ─
label {
    monitor =
    text = SLAYER // $USER
    color = $textSecondary
    font_size = 14
    font_family = $font_family
    position = 0, 56
    halign = center
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = DOOMSHELL
    color = $textDim
    font_size = 11
    font_family = $font_display
    position = 0, 28
    halign = center
    valign = bottom
    zindex = 2
}
